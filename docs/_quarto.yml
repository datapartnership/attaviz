project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "getting-started/*.qmd"
    - "reference/*.qmd"
    - "gallery.qmd"

website:
  title: "attaviz"
  description: "Publication-ready World Bank Group charts and maps for Altair"
  repo-url: https://github.com/datapartnership/attaviz
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Overview"
        href: index.qmd
      - section: "Get started"
        contents:
          - text: "Installation"
            href: getting-started/installation.qmd
          - text: "Quick start"
            href: getting-started/quickstart.qmd
      - text: "Gallery"
        href: gallery.qmd
      - section: "Reference"
        contents:
          - text: "Theme"
            href: reference/theme.qmd
          - text: "Charts"
            href: reference/charts.qmd
          - text: "Maps"
            href: reference/maps.qmd
          - text: "Color palettes"
            href: reference/palettes.qmd
          - text: "Formatting"
            href: reference/formatting.qmd

format:
  html:
    theme: Yeti
    toc: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto

jupyter: python3
