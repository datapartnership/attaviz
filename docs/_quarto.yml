project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "getting-started/*.qmd"
    - "reference/*.qmd"
    - "gallery.qmd"

website:
  title: "Attaviz"
  description: "Publication-ready World Bank Group charts and maps for Altair"
  favicon: images/attaviz-favicon.svg
  repo-url: https://github.com/datapartnership/attaviz
  repo-actions: [edit, issue]
  navbar:
    logo: images/attaviz-mark-reversed.svg
    logo-alt: "attaviz logo"
    left:
      - text: "Quick start"
        href: getting-started/quickstart.qmd
      - text: "Gallery"
        href: gallery.qmd
      - text: "Reference"
        menu:
          - reference/theme.qmd
          - reference/charts.qmd
          - reference/maps.qmd
          - reference/palettes.qmd
          - reference/formatting.qmd
    right:
      - icon: github
        href: https://github.com/datapartnership/attaviz

format:
  html:
    theme: [Yeti, brand, ddp.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
    highlight-style: arrow-light

execute:
  freeze: auto

jupyter: python3
