[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altair-theme-wbg"
version = "0.1.0"
description = "World Bank Group data visualization theme for Altair"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "altair>=5.0",
]

[project.optional-dependencies]
dev = [
    "vl-convert-python",
    "vega-datasets",
    "pandas",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "ipython>=8.18.1",
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "vega-datasets>=0.9.0",
    "vl-convert-python>=1.9.0.post1",
]
