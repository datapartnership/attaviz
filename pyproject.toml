[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attaviz"
version = "0.1.0"
description = "World Bank Group data visualization theme for Altair"
requires-python = ">=3.9"
license = {text = "MPL-2.0"}
dependencies = [
    "altair>=5.0",
    "pyarrow>13.0.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "ipython>=8.18.1",
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "pytest>=8.0",
    "ruff>=0.6",
    "vega-datasets>=0.9.0",
    "vl-convert-python>=1.9.0.post1",
]
docs = [
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "vega-datasets>=0.9.0",
]
